[package]
name = "evoeditor"
description = "evoeditor: Rust 製のテキストエディタ (引数の解析と Host の起動だけ。docs/02 §4.1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "evoeditor"
path = "src/main.rs"

[features]
# テスト専用の経路 (保存途中の kill フック・パニック注入)。配布ビルドには入れない (09 §3.6)
test-hooks = ["eve-core/test-hooks", "eve-host/test-hooks", "eve-platform/test-hooks"]
# 計測用ビルドの区間の記録と隠しオプション `--bench-exit-after-first-frame` (docs/09 §3.6 / §5.2)。配布ビルドには入れない
bench-trace = ["eve-tui/bench-trace"]

[dependencies]
eve-core = { version = "0.4.0-rc.1", path = "../../crates/eve-core" }
eve-config = { version = "0.4.0-rc.1", path = "../../crates/eve-config" }
eve-host = { version = "0.4.0-rc.1", path = "../../crates/eve-host" }
eve-platform = { version = "0.4.0-rc.1", path = "../../crates/eve-platform" }
eve-tui = { version = "0.4.0-rc.1", path = "../../crates/eve-tui" }
eve-view = { version = "0.4.0-rc.1", path = "../../crates/eve-view" }

[dev-dependencies]
# L5 端末 E2E (docs/09 §3.6): ConPTY で実バイナリを駆動し、vt100 で画面を解釈する
portable-pty = "0.9"
vt100 = "0.18"
encoding_rs = "0.8.42"
# 退避の manifest の `xxh3` を本文と突き合わせる (02 §11.2.1)
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
# 隠しオプション `--list-commands --json` / `--dump-keymap --json` の出力の形を確かめる (09 §11.2)
serde_json = "1.0.154"

[target.'cfg(windows)'.dev-dependencies]
# bm_pty: 子のプロセスが消える (後始末が終わる) まで待つ (WaitForSingleObject)
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }

# 実バイナリを ConPTY で駆動する計測 (BM-101b / 102b / 103b / 107)。cargo bench -p evoeditor --bench bm_pty
[[bench]]
name = "bm_pty"
harness = false
