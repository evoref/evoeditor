# 人間とエージェントへの割当表 (docs/11 §2.3、02 §4.6。手書き)。
# エージェントが自分の担当範囲を判定するために読む (GitHub の CODEOWNERS ではない)。
# `cargo xtask check-docs` が path の存在と spec の節が索引にあることを検査する。割当の変更は PR で行い、理由をコミットメッセージに書く。
#
# owner: human:<役割> | agent:<名前> | shared。v0.2 は人間 1 名とエージェントで進めるので、すべて shared にしている。
# owner がだれでも、承認 (merge) は常に人間 (reviewer)。

version = 1

