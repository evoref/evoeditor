# cargo-about の設定 (docs/05 §17.1、docs/11 §9.6)。THIRD-PARTY-NOTICES.md を生成する: cargo xtask gen-notices
# 許可リストは deny.toml と同じ (正本は 05 §17.1)。配布する exe (Windows x86_64、Linux x86_64 / aarch64 の musl 静的版) の依存を
# 対象にする。全ターゲットの和を 1 つのファイルにし、どの配布物にも同じものを同梱する。静的にリンクする musl の表示は
# crate ではないので、gen-notices が dist/notices/musl-COPYRIGHT を末尾に足す
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]
# このリポジトリの crate (publish = false) は一覧に含めない (本体のライセンスは LICENSE / NOTICE)
private = { ignore = true }
ignore-dev-dependencies = true
ignore-build-dependencies = true
