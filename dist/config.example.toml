# evoeditor の設定ファイルの例
#
# 使い方: このファイルを設定のフォルダに config.toml という名前で写して編集します。
#   Windows: %APPDATA%\evoeditor\config.toml
#   Linux:   ~/.config/evoeditor/config.toml ($XDG_CONFIG_HOME があれば $XDG_CONFIG_HOME/evoeditor/config.toml)
# evoeditor は設定のフォルダを自動では作りません。フォルダが無ければ自分で作ってください。
# 設定ファイルが無い、または項目を書かなかったときは、ここに書いた値 (既定値) になります。
# 値を間違えても起動は止まりません。その項目だけ既定値に戻し、起動後に知らせます。
# 書いた内容は `evoeditor --check-config` で確かめられます。
# 現在の版で読む項目は、下に書いたものだけです。

[editor]
# タブ文字の表示幅 (1〜16)。
tab_width = 4
# インデントの操作で入れるもの: "space" (スペース) または "tab" (タブ文字)。
indent_unit = "space"
# "space" のときの、1 段のインデントの幅 (1〜16)。
indent_width = 4
# Backspace で消す単位: "grapheme" (見た目の 1 文字) または "codepoint" (結合文字などを 1 つずつ)。
backspace_unit = "grapheme"

[editor.undo]
# 開いているすべての文書の、元に戻す履歴の合計の上限 (バイト。1048576〜1099511627776)。
# 超えたら、履歴の大きい文書から古い順に捨てます。
total_max_bytes = 268435456

[file]
# 新しいファイルと、文字コードを判定できなかったときの文字コード。
# "utf-8" / "utf-8-bom" / "utf-16le" / "utf-16be" / "shift_jis" / "euc-jp" / "iso-2022-jp" / "system"
# ("system" は OS の既定。Windows の日本語環境では Shift_JIS 系)
default_encoding = "utf-8"
# 新しいファイルの改行: "lf" / "crlf" / "cr" / "native" (Windows では crlf)。
# 既存のファイルは、開いたときの改行のまま保存します。
default_line_ending = "lf"
# これより大きいファイルは、開く前に確かめます (バイト。1048576〜1099511627776)。
huge_file_warn_bytes = 536870912
# これより長い行を「長大行」として軽い表示にし、その文書は折り返しません (バイト。65536〜1073741824)。
long_line_threshold = 1048576
# ほかのアプリがファイルを変えたとき: "auto_if_unmodified" (未保存の変更が無ければ読み直す) /
# "ask" (いつも確かめる) / "never" (画面に戻ったときには確かめない。保存するときには照合します)。
reload_on_external_change = "auto_if_unmodified"

[file.swap]
# 未保存の変更を、少し後にスワップファイルへ書いておくか (異常終了から復元するため)。
enabled = true
# 最後の入力からスワップを書くまでの時間 (ミリ秒。100〜600000)。
interval_ms = 2000
# 入力が続くときの、同じ文書のスワップを書く最短の間隔 (ミリ秒。100〜3600000)。
min_interval_ms = 10000
# これより大きい文書はスワップを書きません (バイト。1048576〜1099511627776)。
max_bytes = 67108864
# 秘密の情報を含みやすい名前のファイル (.env、鍵など) はスワップを書きません。
exclude_secret_files = true

[view]
# 文字幅が環境で異なる文字 (East Asian Ambiguous。例: ± × ○ など) を 1 桁 (1) と 2 桁 (2) のどちらで描くか。
# 端末の設定に合わせます。ずれて表示が崩れるときは 2 にしてください。
ambiguous_width = 1
# 折り返し: "off" (折り返さず横にスクロール) / "soft" (幅で折る) / "word" (単語の切れ目を優先して折る)。
wrap = "off"
# 折り返した行の先頭: "same" (元の行のインデントに揃える) または "none" (揃えない)。
wrap_indent = "same"
# 折り返すとき、句読点や閉じ括弧を行の先頭に置かない (禁則処理)。
wrap_kinsoku = true
# 空白の見せ方: "minimal" (全角スペースとタブ文字を記号で示す) または "off" (示さない)。
show_whitespace = "minimal"

[theme]
# 色の段階: "auto" (端末から判定) / "truecolor" / "256" / "16" / "none" (装飾のみ)。
color_mode = "auto"
# テーマ: "default" / "default-dark" / "default-light" / "ansi"、または themes/<名前>.toml の名前。
name = "default"
# 背景を塗るテーマ (default-dark / default-light) の明暗: "auto" (端末から判定) / "dark" / "light"。
background = "auto"

[ui]
# 画面の言語: "auto" (環境変数 EVE_LANG、OS の言語の順で決める) / "ja" / "en"。
locale = "auto"
# マウスを使うか。false にすると、端末の範囲選択とスクロールをそのまま使えます。
mouse = true
# 画面の下のヒントバーを出すか。
hint_bar = true
# マウスのホイール 1 目盛りでスクロールする行数 (1〜20)。
mouse_wheel_lines = 3
# 続けて押すキー (Ctrl+K など) の 1 つ目を押してから、次に押せるキーの一覧を出すまでの時間 (ミリ秒。0〜5000)。
which_key_delay_ms = 500

[search]
# 正規表現の \n を、改行 1 つ (LF・CRLF・CR のどれか) に一致させるか。false にすると、\n は LF の改行だけに一致します
# (CRLF の改行には一致しません)。
newline_sugar = true
# CP932 の互換文字 (〜 と ～、‖ と ∥、− と －、¢ と ￠、£ と ￡、¬ と ￢、¦ と ￤、— と ―) を、検索で同じ文字として扱うか。
# どちらで探しても両方に一致します (置換の文字列は書いたまま入ります)。¥ と ￥、‾ と ￣ は同一視しません。
cp932_compat_fold = true

[clipboard]
# 端末の機能 (OSC 52) でクリップボードへ書くか: "auto" (SSH の接続中、または OS のクリップボードを使えないとき) /
# "always" / "never"。
osc52 = "auto"
# OSC 52 で送る上限 (base64 にしたバイト数。1000〜16777216)。超えたら送りません。
osc52_max_bytes = 100000
