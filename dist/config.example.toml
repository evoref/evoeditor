# evoeditor の設定ファイルの例
#
# 使い方: このファイルを設定のフォルダに config.toml という名前で写して編集します。
#   Windows: %APPDATA%\evoeditor\config.toml
#   Linux:   ~/.config/evoeditor/config.toml ($XDG_CONFIG_HOME があれば $XDG_CONFIG_HOME/evoeditor/config.toml)
# evoeditor は設定のフォルダを自動では作りません。フォルダが無ければ自分で作ってください。
# 設定ファイルが無い、または項目を書かなかったときは、ここに書いた値 (既定値) になります。
# 値を間違えても起動は止まりません。その項目だけ既定値に戻し、起動後に知らせます。
# 書いた内容は `evoeditor --check-config` で確かめられます。
# 現在の版で読む項目は、下に書いたものだけです。

[editor]
# タブ文字の表示幅 (1〜16)。
tab_width = 4
# インデントの操作で入れるもの: "space" (スペース) または "tab" (タブ文字)。
indent_unit = "space"
# "space" のときの、1 段のインデントの幅 (1〜16)。
indent_width = 4
# Backspace で消す単位: "grapheme" (見た目の 1 文字) または "codepoint" (結合文字などを 1 つずつ)。
backspace_unit = "grapheme"
# 保存するときに、各行の末尾の空白 (半角の空白とタブ) を除く (全角の空白は残します)。カーソルのある行も除きます。
# 言語ごと (Markdown と Diff は除かない) と .editorconfig の trim_trailing_whitespace で替わります。
trim_trailing_whitespace_on_save = false
# 保存するときに、改行で終わらない文書の末尾に改行を 1 つ足す (false でも、ある改行は取り除きません)。
# .editorconfig の insert_final_newline で替わります。
insert_final_newline_on_save = false
# 括弧・引用符の自動閉じ: ( [ { " ` を打つと閉じ字を足し、カーソルを間に置く (直後が行末・空白・閉じ字・句読点のときだけ)。
# 組は言語定義の auto_pairs で言語ごとに替えられます (auto_pairs = {} でその言語だけ止める)。貼り付けでは足しません。
auto_pairs = false

[editor.undo]
# 開いているすべての文書の、元に戻す履歴の合計の上限 (バイト。1048576〜1099511627776)。
# 超えたら、履歴の大きい文書から古い順に捨てます。
total_max_bytes = 268435456

[file]
# 新しいファイルと、文字コードを判定できなかったときの文字コード。
# "utf-8" / "utf-8-bom" / "utf-16le" / "utf-16be" / "shift_jis" / "euc-jp" / "iso-2022-jp" / "system"
# ("system" は OS の既定。Windows の日本語環境では Shift_JIS 系)
default_encoding = "utf-8"
# 新しいファイルの改行: "lf" / "crlf" / "cr" / "native" (Windows では crlf)。
# 既存のファイルは、開いたときの改行のまま保存します。
default_line_ending = "lf"
# これより大きいファイルは、開く前に確かめます (バイト。1048576〜1099511627776)。
huge_file_warn_bytes = 536870912
# これより長い行を「長大行」として軽い表示にし、その文書は折り返しません (バイト。65536〜1073741824)。
long_line_threshold = 1048576
# ほかのアプリがファイルを変えたとき: "auto_if_unmodified" (未保存の変更が無ければ読み直す) /
# "ask" (いつも確かめる) / "never" (画面に戻ったときには確かめない。保存するときには照合します)。
reload_on_external_change = "auto_if_unmodified"

[file.swap]
# 未保存の変更を、少し後にスワップファイルへ書いておくか (異常終了から復元するため)。
enabled = true
# 最後の入力からスワップを書くまでの時間 (ミリ秒。100〜600000)。
interval_ms = 2000
# 入力が続くときの、同じ文書のスワップを書く最短の間隔 (ミリ秒。100〜3600000)。
min_interval_ms = 10000
# これより大きい文書はスワップを書きません (バイト。1048576〜1099511627776)。
max_bytes = 67108864
# 秘密の情報を含みやすい名前のファイル (.env、鍵など) はスワップを書きません。
exclude_secret_files = true

[file.watch]
# 開いているファイルを監視して、ほかのアプリによる変更・削除を知らせるか。表示している未保存の変更の無い文書は
# 読み直します (reload_on_external_change = "auto_if_unmodified" のとき)。"never" のときと、ネットワークの共有などの
# 監視できないフォルダでは監視せず、画面に戻ったときと保存するときに確かめます。
# 設定ファイル (このファイル・keymap.toml・テーマ・languages/・.eve/) も監視し、保存すると読み直します
# (false では config.reload で読み直します。"never" は設定ファイルの監視には効きません)。
enabled = true

[view]
# 文字幅が環境で異なる文字 (East Asian Ambiguous。例: ± × ○ など) を 1 桁 (1) と 2 桁 (2) のどちらで描くか。
# 端末の設定に合わせます。ずれて表示が崩れるときは 2 にしてください。
ambiguous_width = 1
# 折り返し: "off" (折り返さず横にスクロール) / "soft" (幅で折る) / "word" (単語の切れ目を優先して折る)。
wrap = "off"
# 折り返した行の先頭: "same" (元の行のインデントに揃える) または "none" (揃えない)。
wrap_indent = "same"
# 折り返すとき、句読点や閉じ括弧を行の先頭に置かない (禁則処理)。
wrap_kinsoku = true
# 空白の見せ方: "minimal" (全角スペースとタブ文字を記号で示す) または "off" (示さない)。
show_whitespace = "minimal"
# 行番号: "absolute" (各行の番号) / "relative" (カーソルのある行は番号を左に寄せて出し、ほかの行はその行からの行数を
# 右に寄せて出す) / "off" (出さない。折り返した行の続きの印 ↪ も出なくなります)。
line_numbers = "absolute"

[theme]
# 色の段階: "auto" (端末から判定) / "truecolor" / "256" / "16" / "none" (装飾のみ)。
color_mode = "auto"
# テーマ: "default" / "default-dark" / "default-light" / "ansi" / "high-contrast-dark" / "high-contrast-light"、
# または themes/<名前>.toml の名前。high-contrast-* は文字と背景の明るさの差を大きくしたテーマで、端末の配色と同じ明暗を
# 選び、truecolor か 256 色で使ってください。
name = "default"
# 背景を塗るテーマ (default-dark / default-light / high-contrast-dark / high-contrast-light) の明暗: "auto" (名前どおり) /
# "dark" / "light"。名前と逆の値にすると、逆の明暗のテーマになります。
background = "auto"

[ui]
# 画面の言語: "auto" (環境変数 EVE_LANG、OS の言語の順で決める) / "ja" / "en"。
locale = "auto"
# マウスを使うか。false にすると、端末の範囲選択とスクロールをそのまま使えます。
mouse = true
# 画面の下のヒントバーを出すか。
hint_bar = true
# 画面の最上行に、開いている文書の一覧 (タブライン) を出すか: "auto" (文書が 2 つ以上のとき) / "always" (いつも) /
# "never" (出さない)。タブをクリックすると、その文書を今のペインに出します。
tab_line = "auto"
# マウスのホイール 1 目盛りでスクロールする行数 (1〜20)。
mouse_wheel_lines = 3
# 続けて押すキー (Ctrl+K など) の 1 つ目を押してから、次に押せるキーの一覧を出すまでの時間 (ミリ秒。0〜5000)。
which_key_delay_ms = 500

[search]
# 正規表現の \n を、改行 1 つ (LF・CRLF・CR のどれか) に一致させるか。false にすると、\n は LF の改行だけに一致します
# (CRLF の改行には一致しません)。
newline_sugar = true
# CP932 の互換文字 (〜 と ～、‖ と ∥、− と －、¢ と ￠、£ と ￡、¬ と ￢、¦ と ￤、— と ―) を、検索で同じ文字として扱うか。
# どちらで探しても両方に一致します (置換の文字列は書いたまま入ります)。¥ と ￥、‾ と ￣ は同一視しません。
cp932_compat_fold = true
# 検索バーを開いたときの大文字小文字の区別: "smart" (検索語に大文字を含めば区別する) / "sensitive" (いつも区別する) /
# "insensitive" (いつも区別しない)。検索バーの中で Alt+C でも切り替えられます (切り替えた値は、その検索バーを閉じるまでです)。
case = "smart"
# 検索バーを開いたときに、正規表現のモードにするか。検索バーの中で Alt+R でも切り替えられます。
regex_default = false
# 検索で保持する一致の上限 (100〜1000000)。
max_matches = 10000
# 検索で一致の件数を数える上限 (1000〜1000000000)。超えたら数えるのをやめて「N+」と出します。
count_limit = 1000000
# 横断検索とファインダで、リポジトリの .gitignore と .git/info/exclude を効かせるか。false でも workspace.exclude は効きます。
workspace.respect_gitignore = true
# 横断検索とファインダが、シンボリックリンク (Windows のジャンクションを含む) の先のフォルダへ降りるか。
workspace.follow_symlinks = false
# 横断検索で探すファイルの大きさの上限 (バイト。1024〜1073741824)。超えたファイルは飛ばして数えます。
workspace.max_file_size = 2097152

[clipboard]
# 端末の機能 (OSC 52) でクリップボードへ書くか: "auto" (SSH の接続中、または OS のクリップボードを使えないとき) /
# "always" / "never"。
osc52 = "auto"
# OSC 52 で送る上限 (base64 にしたバイト数。1000〜16777216)。超えたら送りません。
osc52_max_bytes = 100000

[workspace]
# ワークスペースのルートを探す目印 (フォルダの直下の名前)。開いたファイルのフォルダから上へ探し、最初に見つかった所を
# ルートにします。起動時に決まります。
root_markers = [".eve", ".git", ".hg", ".svn"]
# ファインダと横断検索で除く物 (.gitignore の 1 行と同じ書き方)。足すときは "exclude+" = ["*.log"] と書けます。
exclude = ["**/.git", "**/node_modules", "**/target"]
# ワークスペース設定 (.eve/config.toml・.eve/keymap.toml) と .editorconfig を、所有者の検査なしで読むフォルダ (絶対パス)。
# exFAT のドライブや WSL の /mnt/c の上のリポジトリなど、所有者を確かめられない場所のためのものです。ここ (ユーザーの設定) と
# --set でだけ書けます。
safe_directories = []

# OS・環境ごとの値 (条件付きセクション): 同じファイルを Windows・macOS・Linux で共有し、条件に合うときだけ効く値を
# 書けます。条件の無い値の後に os → frontend → env の順に重なります (後が勝ちます)。条件は
# os.windows / os.macos / os.linux / os.unix (macOS と Linux) / frontend.tui / env.ssh / env.tmux / env.wsl。
# 今効いている値と、どこで決まったかは、コマンドパレットの「設定の値と由来を表示」で確かめられます。
# [os.windows.file]
# default_line_ending = "crlf"
# [env.ssh.clipboard]
# osc52 = "always"
