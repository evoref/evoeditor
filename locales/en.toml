# locales/en.toml: bundled English UI messages (docs/07 §17, docs/04 §15).
# The key set must match locales/ja.toml exactly (checked by `cargo xtask i18n`).
# Accelerator letters in `[X]` labels must match the Japanese labels (they are defined in code).
[meta]
language = "en"

[cmd.app.quit]
description = "Quit the editor."
title = "Quit"

[cmd.app.quit_with_error]
description = "Quit without saving, with exit code 4 (like Vim's :cq). Use it to abort git commit and the like. If documents have unsaved changes, you are asked as when quitting."
title = "Quit with Error"

[cmd.app.save_and_quit]
description = "Save the current document, then quit. If other documents have unsaved changes, you are asked as when quitting."
title = "Save and Quit"

[cmd.app.suspend]
description = "Suspend the editor and return to the shell. Resume it with the shell's fg."
title = "Suspend"

[cmd.clipboard.copy]
description = "Copy the selection to the clipboard."
title = "Copy"

[cmd.clipboard.cut]
description = "Cut the selection and put it on the clipboard."
title = "Cut"

[cmd.config.reload]
description = "Reload the settings files (config.toml and keymap.toml) without restarting."
title = "Reload Settings"

[cmd.config.show_diagnostics]
description = "List the problems in the settings file, the keymap, the theme and the language file. Press Enter to open the file at that line."
title = "Show Settings Diagnostics"

[cmd.cursor.doc_end]
