external_deleted = "{path} は削除されています — `[K] 新規として保持 (保存で作り直す)` ★ / `[C] 閉じる`"
external_modified = "{path} は他のプログラムで変更されています — `[L] 再読込 (自分の変更を破棄)` / `[I] 無視 (保存時に再確認)` ★"
quit_saving = "{path} の保存が終わっていません — `[W] 待つ` ★ / `[Q] 保存を中止して終了 (保存していない内容は退避します)`"
reload_discard = "{path} を読み込み直すと、保存していない変更が失われます (読み込み直した後に元に戻すで戻せます) — `[L] 再読込 (変更を破棄)` / `[Esc] キャンセル` ★"
save_failed = "保存できません: (上の `msg.save.*` の text) — (Busy のときだけ `[T] 再試行` /) `[A] 別名で保存` ★ / `[R] 退避先に保存` (`[Esc] キャンセル` = 中止)"
save_failed_closed = "保存できませんでした: (`msg.save.*` の text) — {path} は既に閉じています。`[R] 退避先に保存` ★ / `[D] 破棄`"
