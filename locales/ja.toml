overwrite_without_backup = "{path} のバックアップを作れませんでした。バックアップなしで上書きしますか? 上書きの途中で失敗・中断すると、元の内容は取り戻せません — `[O] バックアップなしで上書き` / `[A] 別名で保存` (★ は `[Esc] キャンセル`)"
read_only = "{path} は読み取り専用です — `[A] 別名で保存` ★ / `[W] 読み取り専用を解除して保存`"
target_exists = "{path} は、この文書を作った後に他のプログラムによって作られています — `[O] 上書き` / `[A] 別名で保存` ★"
