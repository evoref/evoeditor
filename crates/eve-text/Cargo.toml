[package]
name = "eve-text"
description = "rope ラッパ (TextStorage)、位置変換、書記素・単語境界、表示幅、ChangeSet、Range / Selection (docs/02 §4.1、docs/03 §2〜§4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ropey = { version = "1.6.1", default-features = false, features = ["cr_lines", "simd"] }

[dev-dependencies]
memory-stats = "1.2.0"
proptest = "1.12.0"

# 自前のハーネス (p50 / p99 を出すため criterion は使わない)。cargo bench -p eve-text --bench bm_s02
[[bench]]
name = "bm_s02"
harness = false
