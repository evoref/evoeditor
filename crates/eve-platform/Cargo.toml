[package]
name = "eve-platform"
description = "Ports の OS 実装 (Windows): パス・ディレクトリ・ファイル I/O、Host 側の部品 (docs/02 §4.1、docs/05)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
eve-core = { version = "0.0.0", path = "../eve-core" }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[dev-dependencies]
eve-view = { version = "0.0.0", path = "../eve-view" }
eve-text = { version = "0.0.0", path = "../eve-text" }

# Windows の API (ファイルの識別・クリップボード・コンソールイベント)。unsafe は Windows 専用のモジュールに閉じる (R5)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
] }
