[package]
name = "eve-platform"
description = "Ports の OS 実装 (Windows): パス・ディレクトリ・ファイル I/O、Host 側の部品 (docs/02 §4.1、docs/05)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# テスト専用の経路 (保存途中の kill フック、Unix の保存のシステムコールの失敗の差し替え。環境変数 `EVE_TEST_HOOK`)。配布ビルドには入れない (09 §3.6)
test-hooks = []

[dependencies]
eve-core = { version = "0.4.0", path = "../eve-core" }
eve-text = { version = "0.4.0", path = "../eve-text" }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[dev-dependencies]
eve-view = { version = "0.4.0", path = "../eve-view" }
# FileSystem の契約試験 (eve_testkit::fs_contract を MemFs と同じく実 FS に掛ける。tests/fs_contract.rs だけが使う)
eve-testkit = { version = "0.4.0", path = "../eve-testkit" }
memory-stats = "1.2.0"
encoding_rs = "0.8.42"

[[bench]]
name = "bm_104_202"
harness = false

# Windows の API (ファイルの識別・クリップボード・コンソールイベント)。unsafe は Windows 専用のモジュールに閉じる (R5)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    # CancelSynchronousIo (標準入力の読取の停止、05 §9.1。v0.4 の M25)
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

# ファイル監視 (FR-117、05 §12。v0.5 の M33 の段 7)。版の決め方は 02 §13.7 (9.0 の安定版)。`default-features = false` で
# macOS の backend を入れない。監視するのは Windows と Linux だけ (macOS は出荷する版で決める、05 §12.2 の 13。
# backend の無い OS で notify の `RecommendedWatcher` がポーリングにならないよう、その OS には依存そのものを置かない)
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
notify = { version = "9.0.0", default-features = false }

# Unix の API (xattr・renameat2・access)。unsafe は Unix 専用のモジュール `unix_fs` に閉じる (R5)
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
# シグナルを自己パイプに変えて専用スレッドで受ける (05 §11.1)
signal-hook = { version = "0.4.6", default-features = false, features = ["iterator"] }
