[package]
name = "eve-testkit"
description = "ヘッドレス駆動ハーネス (Harness)、偽 Port (MemFs・ManualClock・ManualJobSpawner)、HeadlessFrontend (docs/02 §4.1、docs/09 §3.4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
eve-core = { version = "0.1.0", path = "../eve-core" }
eve-view = { version = "0.1.0", path = "../eve-view" }
eve-host = { version = "0.1.0", path = "../eve-host" }
eve-config = { version = "0.1.0", path = "../eve-config" }
eve-text = { version = "0.1.0", path = "../eve-text" }
# シナリオ DSL (TOML) の読み込み (docs/11 §6.3、v0.2)
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
unicode-width = "0.2"

[dev-dependencies]
# no_network の実 FS (bench だけが使う。ライブラリの本体は eve-platform に依存しない)
eve-platform = { version = "0.1.0", path = "../eve-platform" }

# 自前のハーネス (p50 / p99 を出すため criterion は使わない)。cargo bench -p eve-testkit --bench bm_105
[[bench]]
name = "bm_105"
harness = false

[[bench]]
name = "bm_103a"
harness = false

[[bench]]
name = "bm_106"
harness = false

# 回帰の検出 (命令数と wall-clock の A/B) の計測の本体。cargo xtask perf-diff が基準と比べる (docs/09 §5.4)
[[bench]]
name = "bm_instr"
harness = false

# NFR-501 AC-2 の無通信の検査のシナリオ (cargo xtask no-network が strace の下で走らせる、docs/09 §3.6)
[[bench]]
name = "no_network"
harness = false
