[package]
name = "eve-testkit"
description = "ヘッドレス駆動ハーネス (Harness)、偽 Port (MemFs・ManualClock・ManualJobSpawner)、HeadlessFrontend (docs/02 §4.1、docs/09 §3.4)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
eve-core = { version = "0.3.0", path = "../eve-core" }
eve-view = { version = "0.3.0", path = "../eve-view" }
eve-host = { version = "0.3.0", path = "../eve-host" }
eve-config = { version = "0.3.0", path = "../eve-config" }
eve-text = { version = "0.3.0", path = "../eve-text" }
# シナリオ DSL (TOML) の読み込み (docs/11 §6.3、v0.2)
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
unicode-width = "0.2"

[dev-dependencies]
# no_network の実 FS (bench だけが使う。ライブラリの本体は eve-platform に依存しない)
eve-platform = { version = "0.3.0", path = "../eve-platform" }
# 確保の回数の計測 (bench の bm_allocs だけ。自前の unsafe を書かずに GlobalAlloc を数える。2026-11-05 PO、02 §13.0)
stats_alloc = "0.1.10"
# BM-109m の比べる相手 (全文を連結して探す参照、09 §5.2。bench の bm_109 だけ)。eve-core が既に使う crate で、feature も
# eve-core とそろえる (crate の数も版も増えない)
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }

# 自前のハーネス (p50 / p99 を出すため criterion は使わない)。cargo bench -p eve-testkit --bench bm_105
[[bench]]
name = "bm_105"
harness = false

[[bench]]
name = "bm_103a"
harness = false

[[bench]]
name = "bm_106"
harness = false

# spike (M25 の 6): 長大行の折り返しの判定 (09 §5.2 の BM-106w、03 §14.4 の「長大行の折り返し」)
[[bench]]
name = "bm_106w"
harness = false

# 回帰の検出 (命令数と wall-clock の A/B) の計測の本体。cargo xtask perf-diff が基準と比べる (docs/09 §5.4)
[[bench]]
name = "bm_instr"
harness = false

[[bench]]
name = "bm_allocs"
harness = false

# NFR-501 AC-2 の無通信の検査のシナリオ (cargo xtask no-network が strace の下で走らせる、docs/09 §3.6)
[[bench]]
name = "no_network"
harness = false

# BM-306 の長時間の soak (NFR-306。cargo xtask nightly の soak の手順が回す。傾向の観察のみ、docs/09 §6.3)
[[bench]]
name = "bm_306"
harness = false

[[bench]]
name = "bm_109"
harness = false
