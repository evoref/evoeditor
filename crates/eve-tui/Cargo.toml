[package]
name = "eve-tui"
description = "Frontend の TUI 実装: 端末能力の判定・Frame → ratatui Buffer 描画・入力の正規化 (docs/02 §4.1、docs/04)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# 計測用ビルドの区間の記録 (docs/09 §3.6)。配布ビルドには入れない
bench-trace = []

[dependencies]
eve-view = { version = "0.2.0", path = "../eve-view" }
eve-host = { version = "0.2.0", path = "../eve-host" }
# 採用版は S-06 で固定 (02 §13.2)。ウィジェットは使わず、Buffer のセルへの書込と差分出力だけを使う (ADR-0005)
ratatui = { version = "=0.30.2", default-features = false }
# 編集面の Span (幅の同じ書記素の連続) を書記素ごとのセルに分ける (eve_view::Span の契約)。eve-text と同じ版
unicode-segmentation = "1"

# Windows の入力 (ReadConsoleInputW の自前ループ) とコンソールモード。unsafe は src/win.rs に閉じる (R5)
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

# Unix の端末 (termios・poll・ioctl) と SIGWINCH / SIGCONT の自己パイプ。unsafe は src/unix.rs に閉じる (R5)
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"
signal-hook = { version = "0.4.6", default-features = false }

[dev-dependencies]
eve-testkit = { version = "0.2.0", path = "../eve-testkit" }
# 入力スレッドの panic を Host まで通す試験 (frontend.rs) で Host を組む (Ports)
eve-core = { version = "0.2.0", path = "../eve-core" }
eve-docs-tables = { version = "0.2.0", path = "../eve-docs-tables" }
unicode-width = "0.2"
proptest = "1.12.0"
