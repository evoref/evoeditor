# fuzz_decode / fuzz_editor / fuzz_encode / fuzz_vt_input (docs/09 §3.3 / §6.3)。本体の workspace から除外した別の crate (cargo-fuzz の標準の配置)。
# 実行は Linux の nightly だけ: `cargo +nightly fuzz run fuzz_decode -- -max_total_time=600 -close_fd_mask=3`
# (libFuzzer は MSVC 非対応。Windows の CI では同じ関数を回す: crates/eve-encoding/tests/fuzz_decode.rs、
# crates/eve-testkit/tests/fuzz_editor.rs)。
[package]
name = "eve-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
eve-encoding = { path = "../crates/eve-encoding" }
eve-testkit = { path = "../crates/eve-testkit" }
eve-tui = { path = "../crates/eve-tui" }

[[bin]]
name = "fuzz_decode"
path = "fuzz_targets/fuzz_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_editor"
path = "fuzz_targets/fuzz_editor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_encode"
path = "fuzz_targets/fuzz_encode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_vt_input"
path = "fuzz_targets/fuzz_vt_input.rs"
test = false
doc = false
bench = false

# 算術のあふれも見つける (cargo fuzz は release で組む。release の既定は overflow-checks = false)
[profile.release]
overflow-checks = true
debug-assertions = true

# 本体の workspace に入れない
[workspace]
