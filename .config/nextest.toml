# cargo-nextest の設定 (docs/09-testing-quality.md §3.6 / §6.2、docs/11-dev-workflow.md §1)。
# retries を付けてよいのは L5 (E2E) だけ (docs/11 §1)。それ以外の profile に retries を付けない。

# L5 (E2E) の同時実行数。1 テストが ConPTY のプロセスを起動し、保存・退避・スワップで fsync を打つので、コア数なりに並べると
# ディスクの fsync が詰まり、緊急退避の時間予算 (CTRL_CLOSE は 3.5 s) や待ちの上限を超えて不安定になる (24 コアの開発機で再現した)。
# CI の Windows ランナー (4 コア) と同じ並びにそろえるため、全 profile で 4 に抑える (docs/09 §3.6)。
[test-groups]
e2e = { max-threads = 4 }

[profile.default]
fail-fast = true

[[profile.default.overrides]]
filter = 'package(evoeditor) & binary(e2e)'
test-group = 'e2e'

# CI (ci.yml の test ジョブ)。失敗しても残りのテストを回し、すべての失敗をまとめて見せる。
[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = 'package(evoeditor) & binary(e2e)'
test-group = 'e2e'

# 時間の記録 (docs/09 §3.6 の「時間の判定」): 緊急退避の時間は CI では合否にせず、試験が stderr に出す `[時間の記録]` を
# ログに残す。合格した試験の出力は既定では出ないので、退避の時間を測る試験だけ出す。
[[profile.ci.overrides]]
filter = '(package(evoeditor) & binary(e2e) & test(/退避|ctrl_break|sigterm|sighup|sigint|シグナル/)) | (package(eve-platform) & binary(rescue) & test(/100_mb/))'
success-output = "final"

# L5 の E2E (ConPTY、feature test-hooks)。端末の挙動は揺れるので、ここだけ retries を許す。
# ジョブ (ci.yml の e2e) が `-p evoeditor --test e2e` で使う。test-hooks のシナリオは M3 以降。
[profile.e2e]
fail-fast = false
retries = 2
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.e2e.overrides]]
filter = 'package(evoeditor) & binary(e2e)'
test-group = 'e2e'

# 時間の記録 (上の profile.ci と同じ。docs/09 §3.6)
[[profile.e2e.overrides]]
filter = 'package(evoeditor) & binary(e2e) & test(/退避|ctrl_break|sigterm|sighup|sigint|シグナル/)'
success-output = "final"

# 夜間 (`cargo xtask nightly` の proptest 拡張。PROPTEST_CASES=10000)。1 テストが数分かかることがあるので、
# `ci` の 5 分で打ち切らず、30 分まで許す (最も長い試験は 8 分ほど。docs/09 §6.3)。段の全体は xtask の時間の予算 (45 分) で
# 打ち切る。1 テストの上限を予算より短くして、段の前半で止まった試験は予算の打ち切りではなく TIMEOUT (失敗) で分かるようにする。
# retries は付けない。
[profile.nightly]
fail-fast = false
slow-timeout = { period = "300s", terminate-after = 6 }
