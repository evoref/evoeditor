# v0.1 の Must の受入基準 (AC) のチェックリスト (docs/11-dev-workflow.md §3.3、docs/08-roadmap.md M0c (d))。
#
# - 01-requirements.md §5.1〜5.4 の AC を、AC-<要件 ID>-<n> の形で 1 件ずつ並べる。
# - 人が更新する。AC を満たす PR を merge するときに、status を done にし、verified_by に
#   検証の実体 (テスト関数名・ベンチ ID・docs/compat/ の手順の記録) を書く。
# - kind は docs/09-testing-quality.md §8.5 の検証区分 (T: 自動テスト, B: ベンチ, M: 手動, R: レビュー)。
#   AC 単位で区分が違う場合 (例 FR-206 の AC-3 は M) は、実装時に kind を直す。
# - status = "done" の項目は verified_by が 1 つ以上必要 (xtask check の検査、11 §3.3)。
# - 初版は 01 §5 の表と 09 §8.5 の表から起こした (2026-10-20)。抽出の規則は docs/11 §8.5 (eve-docs-tables が実装)。
#   後の版の AC (頭部の注記が v0.2 などの版や「…版から適用」を含むもの) は含めない。

