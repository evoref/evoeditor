# 依存の更新 (docs/09-testing-quality.md §6.3、docs/11-dev-workflow.md §9.1)。
# 週 1 回・グループ化で PR の洪水を避ける。宛先は develop (バージョン更新のみ。
# セキュリティ更新の PR の宛先は GitHub の仕様で既定ブランチ、docs/11 §9.8)。
# Cargo.toml が無い間は、cargo の更新は「マニフェストが見つからない」と報告される。
# M1 のタスク (0) で workspace を置くと解消する。
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-dependencies:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /fuzz
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-fuzz-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns: ["*"]
