# 夜間ジョブ (docs/09-testing-quality.md §6.1 / §6.3、docs/11 §1)。毎日 UTC 18:00 (JST 03:00) と手動 (workflow_dispatch)。
# `schedule` は既定ブランチのワークフロー定義で動くので、ここは薄いトリガだけ: 対象のブランチ (変数 NIGHTLY_REF、未設定なら develop。
# 手動実行では引数 ref で上書き) をチェックアウトし、そのコードの `cargo xtask nightly` を入口にする (手順の中身は xtask にある)。
# 中身: fuzz の 5 つのターゲット (v0.4。各 16 分、合計 80 分。ターゲットを絞らないときは xtask が合計 80 分に抑える)・proptest 拡張 (PROPTEST_CASES=10000。xtask が 45 分の予算で打ち切る)・cargo audit / deny advisories (本体と fuzz/)・coverage (報告のみ)・
# 保存のクラッシュ一貫性 (v0.2。LazyFS で電源断を模擬する、NFR-301)・長時間の soak (v0.2。BM-306 を 60 分。観察のみ、NFR-306)。
# 別のジョブ beta (linux): beta のツールチェーンで fmt・clippy・nextest (09 §6.3。2026-11-20 に足した。記録のみで、失敗しても実行の成否に数えない)。
# schedule は既定ブランチ (main) の定義で動くので、beta のジョブが定時に走るのは、この定義が main に入った後 (v0.5.0 の昇格)。
# fuzz のクラッシュ入力は `.github/fuzz-recipients.txt` の公開鍵で age により暗号化したものだけを artifact に上げる (平文は消す)。
name: nightly

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "対象のブランチまたはコミット (空なら vars.NIGHTLY_REF、それも無ければ develop)"
        required: false
        default: ""
      fuzz_seconds:
        description: "fuzz の各ターゲットの時間 (秒。既定 800。ターゲットを絞らないときは合計 80 分に抑える)。リリース前の 1 時間の fuzz は 3600 で only の fuzz:<ターゲット> と一緒に (docs/09 §8.2)"
        required: false
        default: "600"
      only:
        description: "実行する手順を絞る (fuzz,proptest,audit,coverage,crash,soak のカンマ区切り。空なら全部)。fuzz は fuzz:fuzz_decode+fuzz_editor でターゲットを絞れる (リリース前の 1 時間、docs/09 §8.2)。beta だけを回すときは beta (単独で。beta のジョブだけが走る)"
        required: false
        default: ""
      soak_minutes:
        description: "soak (BM-306) の時間 (分。既定 60)"
        required: false
        default: "60"

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # xtask の各手順の時間の上限 (秒)。soak は 60 分回すので、既定の 20 分では足りない (proptest 拡張はこの上限ではなく、xtask の
  # 時間の予算 45 分で打ち切る。docs/09 §6.3)
  XTASK_STEP_TIMEOUT_SECS: "5400"

defaults:
  run:
    shell: bash

# アクションはコミット SHA で固定する (docs/09 §6.5)。更新は Dependabot (github-actions) が PR にする。
# actions/checkout v7.0.1          3d3c42e5aac5ba805825da76410c181273ba90b1
# Swatinem/rust-cache v2.9.2       6323deb102c322ba6fcbdcafc7e3dddab59af2b6
# taiki-e/install-action v2.87.29  8cca0918f8471c33515202b73f56ab27f2bed283
# actions/cache v6.1.0             55cc8345863c7cc4c66a329aec7e433d2d1c52a9
# actions/upload-artifact v7.0.2   cf430e030ddbb5b0abf93d22962f4752f3646cd9

jobs:
  nightly:
    name: nightly (linux)
    # only=beta の手動実行では、beta のジョブだけを走らせる
    if: inputs.only != 'beta'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    # 起票 (ジョブの失敗とクラッシュの件数だけを書く、09 §6.3) のために issues: write をこのジョブに限って足す
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || vars.NIGHTLY_REF || 'develop' }}
          persist-credentials: false
      - name: Rust (stable + nightly)
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview --no-self-update
          rustup default stable
          rustup toolchain install nightly --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-nightly
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.148,cargo-fuzz@0.13.2,cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-llvm-cov@0.9.1
      - name: age (クラッシュ入力の暗号化)
        run: sudo apt-get update && sudo apt-get install -y age
      # 夜間の実行で増えた fuzz のコーパスを持ち越す (コミットしない。最小コーパスの更新は人間が PR で行う、09 §6.3)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-
      # 保存のクラッシュ一貫性 (crash の手順、docs/09 §6.3、OQ-143) の道具: LazyFS (MIT。版をコミットで固定してビルドする。CI の道具で
      # 配布物に入らない) と、その下の FS (ext4 / xfs / btrfs のループバック)。xtask へは LAZYFS_BIN と EVE_CRASH_ROOTS で渡す
      - name: LazyFS と下の FS の用意
        if: inputs.only == '' || contains(inputs.only, 'crash')
        env:
          LAZYFS_REV: 045a0b3a1126725e693934e29d3ba15e08cc39ec # 0.3.1
        run: |
          sudo apt-get install -y fuse3 libfuse3-dev cmake xfsprogs btrfs-progs
          src="$RUNNER_TEMP/lazyfs"
          git clone -q https://github.com/dsrhaslab/lazyfs "$src"
          git -C "$src" checkout -q "$LAZYFS_REV"
          (cd "$src/libs/libpcache" && ./build.sh > /dev/null)
          (cd "$src/lazyfs" && ./build.sh > /dev/null)
          test -x "$src/lazyfs/build/lazyfs"
          echo "LAZYFS_BIN=$src/lazyfs/build/lazyfs" >> "$GITHUB_ENV"
          roots=""
          for fs in ext4 xfs btrfs; do
            img="$RUNNER_TEMP/$fs.img"
            mnt="/mnt/eve-$fs"
            truncate -s 512M "$img"
            case "$fs" in
              ext4) sudo mkfs.ext4 -F -q "$img" ;;
              xfs) sudo mkfs.xfs -f -q "$img" ;;
              btrfs) sudo mkfs.btrfs -f -q "$img" ;;
            esac
            sudo mkdir -p "$mnt"
            sudo mount -o loop "$img" "$mnt"
            sudo chown "$(id -u):$(id -g)" "$mnt"
            roots="$roots:$mnt"
          done
          echo "EVE_CRASH_ROOTS=${roots#:}" >> "$GITHUB_ENV"
      - name: cargo xtask nightly
        id: nightly
        run: |
          only="${{ inputs.only }}"
          if [ -n "$only" ]; then
            cargo xtask nightly --fuzz-seconds "${{ inputs.fuzz_seconds || '800' }}" --soak-minutes "${{ inputs.soak_minutes || '60' }}" --only "$only"
          else
            cargo xtask nightly --fuzz-seconds "${{ inputs.fuzz_seconds || '800' }}" --soak-minutes "${{ inputs.soak_minutes || '60' }}"
          fi
      - name: 要約
        if: always()
        run: |
          if [ -f target/nightly/summary.txt ]; then
            { echo '## nightly'; echo '```'; cat target/nightly/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      # 暗号化したクラッシュ入力だけを上げる (平文は xtask が消している)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fuzz-crashes-encrypted
          path: target/nightly/fuzz-artifacts/*.age
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nightly-report
          path: |
            target/nightly/lcov.info
            target/nightly/summary.txt
            target/nightly/soak.jsonl
          if-no-files-found: ignore
      # 失敗の起票: 書くのはジョブの失敗とクラッシュの件数 (要約) だけ。入力・スタック・原因の推測は書かない。
      # 起票するのは定時の実行だけ (手動の実行は起動した人が結果を見る。作業ブランチでの試しの実行で課題を増やさない)
      - name: 失敗の起票
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="nightly の実行が失敗しました: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -f target/nightly/summary.txt ]; then
            body="${body}"$'\n\n```\n'"$(cat target/nightly/summary.txt)"$'\n```'
          fi
          gh issue create --title "nightly: 失敗 ($(date -u +%Y-%m-%d))" --body "${body}"

  # beta の検査 (docs/09 §6.3): 次の安定版で増える clippy の lint や rustc の警告を、安定版になる前に見つける (Rust 1.100 の #537 / #538)。
  # 夜間の段 (上のジョブ) の時間の上限 240 分を使わないように、別のジョブにして並行に走らせる。記録のみ: continue-on-error で
  # 実行の成否に数えず、定時の実行で失敗したときだけ起票する。手順の中身は xtask (`cargo xtask nightly --only beta`) にある。
  beta:
    name: beta (linux)
    if: inputs.only == '' || inputs.only == 'beta'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || vars.NIGHTLY_REF || 'develop' }}
          persist-credentials: false
      # xtask は stable でビルドする。beta のツールチェーン (clippy・rustfmt・Windows のターゲット) は xtask が入れる
      - name: Rust (stable)
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: linux-beta
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.148
      - name: cargo xtask nightly --only beta
        run: cargo xtask nightly --only beta
      - name: 要約
        if: always()
        run: |
          if [ -f target/nightly/summary.txt ]; then
            { echo '## beta'; echo '```'; cat target/nightly/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 失敗の起票
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="nightly の beta の検査が失敗しました (次の安定版の前に直す、docs/09 §6.3): ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -f target/nightly/summary.txt ]; then
            body="${body}"$'\n\n```\n'"$(cat target/nightly/summary.txt)"$'\n```'
          fi
          gh issue create --title "nightly: beta の検査で失敗 ($(date -u +%Y-%m-%d))" --body "${body}"
